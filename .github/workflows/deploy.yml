name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Bisa juga dijalankan manual dari tab "Actions".
  workflow_dispatch:

# Izin yang dibutuhkan GitHub Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Kalau ada push baru saat deploy berjalan, tunggu yang lama selesai.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        # DEPLOY_TARGET membuat vite.config.ts memakai base '/<NAMA-REPO>/'.
        # Nama repo diatur lewat konstanta GITHUB_REPO_NAME di vite.config.ts.
        env:
          DEPLOY_TARGET: gh-pages
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
